name: Build IlyasTV AAB (Release Bundle)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare Keystore for Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "HATA: KEYSTORE_BASE64 secret bulunamadi!"
            exit 1
          fi
          
          # Base64'u kesin ve hatasiz sekilde dosyaya yaz
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          
          # Dosyanin boyutunu kontrol et ve bas
          ls -la my-upload-key.jks
          
          # Anahtari app klasorune kopyala
          cp my-upload-key.jks app/my-upload-key.jks

      - name: Build Release Bundle (.aab)
        run: |
          chmod +x ./gradlew || true
          gradle :app:bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/app/my-upload-key.jks \
            -Pandroid.injected.signing.store.password=IlyasTv2026! \
            -Pandroid.injected.signing.key.alias=ilyastv \
            -Pandroid.injected.signing.key.password=IlyasTv2026! \
            --no-daemon --stacktrace

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IlyasTV-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
