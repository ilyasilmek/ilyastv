name: Build IlyasTV AAB (Release Bundle)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare Keystore for Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          elif [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -alias ilyastv -keyalg RSA -keysize 2048 -validity 10000 -storepass IlyasTv2026! -keypass IlyasTv2026! -dname "CN=IlyasTV, OU=Mobile, O=IlyasTV, L=Istanbul, ST=Istanbul, C=TR"
          fi
          # Anahtarı hem ana dizine hem de app klasörüne kopyalıyoruz
          cp my-upload-key.jks app/my-upload-key.jks

      - name: Build Release Bundle (.aab)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/my-upload-key.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ilyastv' }}
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || 'IlyasTv2026!' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'IlyasTv2026!' }}
        run: gradle bundleRelease --stacktrace -Dksp.useKSP2=true

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IlyasTV-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
